# Automated dependency updates and security alerts
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/tp-cli"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      # Keep Node types aligned with the minimum supported Node major (engines)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Group dev dependency bumps to reduce PR noise
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
