[workspace]
members = ["tui-kit", "todo-tui", "til-tui", "diff-tui"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
tui-kit = { path = "tui-kit" }
anyhow = "1.0.103"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "2.7.0", default-features = false }
textwrap = "0.16.2"
thiserror = "2.0.18"
tui-input = { version = "0.15.3", default-features = false }
two-face = "0.5.2"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
