[package]
name = "til-tui"
version = "0.1.0"
edition = "2024"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1.0.103"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
textwrap = "0.16.2"
thiserror = "2.0.18"
tui-input = { version = "0.15.3", default-features = false }
unicode-width = "0.2"
